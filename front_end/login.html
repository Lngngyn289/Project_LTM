<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Chat Application</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./fonts/fontawesome-free-6.5.2-web/css/all.min.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
    <style>
        .login-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 100vh;
            overflow: hidden;
        }
        .login-left {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 40px;
        }
        .login-left h1 {
            font-size: 48px;
            font-weight: 700;
            margin: 0 0 20px 0;
        }
        .login-left p {
            font-size: 18px;
            margin: 0;
            opacity: 0.9;
            text-align: center;
        }
        .login-right {
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 60px;
        }
        .login-form-wrapper {
            width: 100%;
            max-width: 400px;
        }
        .login-form-wrapper h2 {
            font-size: 32px;
            font-weight: 700;
            color: #1f2937;
            margin: 0 0 8px 0;
        }
        .login-toggle {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 30px;
        }
        .login-toggle a {
            color: #667eea;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        .login-form-wrapper input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 16px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .login-form-wrapper input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .login-help {
            display: flex;
            justify-content: space-between;
            margin-bottom: 24px;
            font-size: 13px;
        }
        .login-help a {
            color: #667eea;
            text-decoration: none;
        }
        .login-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .login-buttons button {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-back {
            background: #f3f4f6;
            color: #1f2937;
            border: 1px solid #e5e7eb;
        }
        .btn-back:hover {
            background: #e5e7eb;
        }
        .login-policy {
            font-size: 12px;
            color: #9ca3af;
            text-align: center;
            line-height: 1.6;
        }
        .login-policy a {
            color: #667eea;
            text-decoration: none;
        }
        @media (max-width: 1024px) {
            .login-wrapper {
                grid-template-columns: 1fr;
            }
            .login-left {
                display: none;
            }
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const switchBtn = document.querySelector(".login-toggle a");
            switchBtn.addEventListener("click", (e) => {
                e.preventDefault();
                window.location.href = "signup.html";
            });

            let ws;
            function setupWS() {
                ws = new WebSocket("ws://localhost:8080");
                ws.onmessage = (event) => {
                    const response = event.data.trim();
                    console.log(response);
                    const parts = response.split(" ");
                    const userId = parts[0];
                    const username = parts.slice(1).join(" ");
                    if (!isNaN(userId) && username) {
                        sessionStorage.setItem("user_id", userId);
                        sessionStorage.setItem("user_name", username.trim());
                        alert("Login successful!");
                        window.location.href = "chat-private.html";
                    } else {
                        alert("Invalid response from server: " + response);
                    }
                };
                ws.onerror = (error) => {
                    console.error("WebSocket Error:", error);
                };
            }
            setupWS();

            function encodeMessage(commandCode, username, password) {
                const commandChar = String.fromCharCode(commandCode);
                return `${commandChar} ${username} ${password}`;
            }

            function sendMessage() {
                const username = document.getElementById("username").value.trim();
                const password = document.getElementById("password").value.trim();
                if (!username || !password) {
                    alert("Vui lòng nhập đầy đủ thông tin!");
                    return;
                }
                const message = encodeMessage(0x02, username, password);
                if (ws.readyState === WebSocket.OPEN) {
                    ws.send(message);
                } else {
                    alert("Không thể kết nối đến server. Vui lòng thử lại.");
                }
            }

            document.querySelector(".btn-login").addEventListener("click", (e) => {
                e.preventDefault();
                sendMessage();
            });
        });
    </script>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-left">
            <h1>Chat App</h1>
            <p>Connect with friends instantly</p>
        </div>
        <div class="login-right">
            <div class="login-form-wrapper">
                <h2>Login</h2>
                <div class="login-toggle">
                    Don't have account? <a href="#">Create one</a>
                </div>
                <form id="login-form">
                    <input id="username" type="text" placeholder="Username" />
                    <input id="password" type="password" placeholder="Password" />
                    <div class="login-help">
                        <a href="#">Forgot password?</a>
                        <a href="#">Need help?</a>
                    </div>
                    <div class="login-buttons">
                        <button type="button" class="btn-back">Back</button>
                        <button type="submit" class="btn-login">Login</button>
                    </div>
                </form>
                <p class="login-policy">
                    By logging in, you agree to our<br>
                    <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
