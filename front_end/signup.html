<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Chat Application</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./fonts/fontawesome-free-6.5.2-web/css/all.min.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
    <style>
        .signup-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 100vh;
            overflow: hidden;
        }
        .signup-left {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 40px;
        }
        .signup-left h1 {
            font-size: 48px;
            font-weight: 700;
            margin: 0 0 20px 0;
        }
        .signup-left p {
            font-size: 18px;
            margin: 0;
            opacity: 0.9;
            text-align: center;
        }
        .signup-right {
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 60px;
            overflow-y: auto;
        }
        .signup-form-wrapper {
            width: 100%;
            max-width: 400px;
        }
        .signup-form-wrapper h2 {
            font-size: 32px;
            font-weight: 700;
            color: #1f2937;
            margin: 0 0 8px 0;
        }
        .signup-toggle {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 30px;
        }
        .signup-toggle a {
            color: #f5576c;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        .signup-form-wrapper input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 16px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .signup-form-wrapper input:focus {
            outline: none;
            border-color: #f5576c;
            box-shadow: 0 0 0 3px rgba(245, 87, 108, 0.1);
        }
        .signup-buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            margin-bottom: 20px;
        }
        .signup-buttons button {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-signup {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        .btn-signup:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
        }
        .btn-back {
            background: #f3f4f6;
            color: #1f2937;
            border: 1px solid #e5e7eb;
        }
        .btn-back:hover {
            background: #e5e7eb;
        }
        .signup-policy {
            font-size: 12px;
            color: #9ca3af;
            text-align: center;
            line-height: 1.6;
        }
        .signup-policy a {
            color: #f5576c;
            text-decoration: none;
        }
        @media (max-width: 1024px) {
            .signup-wrapper {
                grid-template-columns: 1fr;
            }
            .signup-left {
                display: none;
            }
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const switchBtn = document.querySelector(".signup-toggle a");
            switchBtn.addEventListener("click", (e) => {
                e.preventDefault();
                window.location.href = "login.html";
            });

            const ws = new WebSocket('ws://localhost:8080');
            function encodeMessage(commandCode, username, password) {
                const commandChar = String.fromCharCode(commandCode);
                return `${commandChar} ${username} ${password}`;
            }
            ws.onmessage = (event) => {
                const message = event.data;
                if (message.includes("Account already exists")) {
                    alert("Tài khoản đã tồn tại. Vui lòng chọn tên khác!");
                } else if (message.includes("Registration failed")) {
                    alert("Đăng ký thất bại. Vui lòng thử lại sau!");
                } else {
                    alert("Đăng ký thành công! Đang chuyển đến trang login...");
                    sessionStorage.setItem("user_id", event.data);
                    window.location.href = "login.html";
                }
            };
            ws.onerror = (error) => {
                console.error('WebSocket Error:', error);
                alert("Có lỗi xảy ra khi kết nối với server.");
            };

            function sendMessage() {
                const username = document.getElementById("username").value;
                const password = document.getElementById("password").value;
                const confirmPassword = document.getElementById("confirm-password").value;

                if (!username || !password || !confirmPassword) {
                    alert("Vui lòng nhập đầy đủ thông tin!");
                    return;
                }
                if (password !== confirmPassword) {
                    alert("Mật khẩu xác nhận không khớp!");
                    return;
                }
                const senMessage = encodeMessage(0x01, username, password);
                ws.send(senMessage);
            }

            document.querySelector(".btn-signup").addEventListener("click", (e) => {
                e.preventDefault();
                sendMessage();
            });
        });
    </script>
</head>
<body>
    <div class="signup-wrapper">
        <div class="signup-left">
            <h1>Join Us</h1>
            <p>Start connecting with friends today</p>
        </div>
        <div class="signup-right">
            <div class="signup-form-wrapper">
                <h2>Create Account</h2>
                <div class="signup-toggle">
                    Already have account? <a href="#">Sign in</a>
                </div>
                <form id="signup-form">
                    <input id="username" type="text" placeholder="Username" />
                    <input id="password" type="password" placeholder="Password" />
                    <input id="confirm-password" type="password" placeholder="Confirm Password" />
                    <div class="signup-buttons">
                        <button type="button" class="btn-back">Back</button>
                        <button type="submit" class="btn-signup">Sign Up</button>
                    </div>
                </form>
                <p class="signup-policy">
                    By signing up, you agree to our<br>
                    <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
