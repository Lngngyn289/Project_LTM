<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Chat - Chat Application</title>
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/chat.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const chatBody = document.querySelector(".chat-body");
        const chatList = document.querySelector(".chat-list");
        const createRoomInput = document.getElementById("create-room-input");
        const joinRoomInput = document.getElementById("join-room-input");
        const createRoomBtn = document.getElementById("create-room-btn");
        const joinRoomBtn = document.getElementById("join-room-btn");
        const usernameDisplay = document.querySelector(".sidebar-header h1");
        const chatHeader = document.getElementById("room-name");
        const switchViewBtn = document.getElementById("switch-to-private-chat-view");

        const sendBtn = document.getElementById("send-btn"); //chat room
        const messageInput = document.getElementById("message-input");

        const addUserBtn = document.getElementById("add-user-btn"); //add user vao room
        const addUserInput = document.getElementById("add-user-input");

        const leaveRoomBtn = document.getElementById("leave-room-btn"); // roi khoi room

        const removeUserBtn = document.getElementById("remove-user-btn"); //xoa khoi room
        const removeUserInput = document.getElementById("remove-user-input");

        const viewMembersBtn = document.getElementById("view-members-btn"); //danh sach member modal
        const membersModal = document.getElementById("members-modal");
        const closeModalBtn = document.querySelector(".close-btn");
        const membersList = document.getElementById("members-list");
        const logoutBtn = document.getElementById("logout-btn");

        function encodeMessage(commandCode, username, password) {
            const commandChar = String.fromCharCode(commandCode);
            return `${commandChar} ${username} ${password}`;
        }

        switchViewBtn.addEventListener("click", () => {
            window.location.href = "chat-private.html";
        });

        // Logout functionality - chỉ gửi CMD_LOGOUT khi user click nút Logout
        // Server sẽ tự động set offline khi WebSocket disconnect
        logoutBtn.addEventListener("click", () => {
            const userId = sessionStorage.getItem("user_id");
            if (userId && socket.readyState === WebSocket.OPEN) {
                // Gửi CMD_LOGOUT = 0x14
                const commandChar = String.fromCharCode(0x14);
                const message = `${commandChar} ${userId} `;
                socket.send(message);
                console.log(`Logout message sent for user ${userId}`);
            }

            // Clear session and redirect to login
            setTimeout(() => {
                sessionStorage.clear();
                window.location.href = "login.html";
            }, 300);
        });
        function getListRoomSideBar() {
            const userId = sessionStorage.getItem("user_id");
            const username = sessionStorage.getItem("user_name");
            if (userId && username) {
                console.log(`User: ${username}, ID: ${userId}`);
                usernameDisplay.textContent = `${username} (ID: ${userId})`; // Hiển thị tên người dùng
                const message = encodeMessage(0x13, userId, "");
                socket.send(message)
                // socket.send(`list_rooms ${userId}`); // Yêu cầu danh sách phòng
            } else {
                alert("User session not found. Please log in again.");
                window.location.href = "login.html";
            }

        }
        // Kết nối WebSocket
        const socket = new WebSocket('ws://localhost:8080');
        socket.onopen = () => {
            console.log("WebSocket connected.");
            const userId = sessionStorage.getItem("user_id");
            const username = sessionStorage.getItem("user_name");

            // Nếu có userId, gửi CMD_RECONNECT để set online
            if (userId) {
                const reconnectMessage = encodeMessage(0x1B, userId, ""); // CMD_RECONNECT = 0x1B
                socket.send(reconnectMessage);
                console.log(`Reconnecting user: ${username} (ID: ${userId})`);
            }

            if (userId && username) {
                console.log(`User: ${username}, ID: ${userId}`);
                usernameDisplay.textContent = `${username} (ID: ${userId})`; // Hiển thị tên người dùng
                const message = encodeMessage(0x13, userId, "");
                socket.send(message)
                // socket.send(`list_rooms ${userId}`); // Yêu cầu danh sách phòng
            } else {
                alert("User session not found. Please log in again.");
                window.location.href = "login.html";
            }

        };
        function setupRoomClickEvents() {
            const roomItems = document.querySelectorAll(".chat-item");
            roomItems.forEach(item => {
                item.addEventListener("click", () => {
                    const roomInfo = item.querySelector("h4").innerText; // Lấy thông tin từ tiêu đề h4
                    const [roomName, roomId] = roomInfo.split(":id-"); // Tách tên phòng và ID
                    console.log(roomId);


                    // Cập nhật header với tên nhóm và ID
                    chatHeader.textContent = `${roomName} (ID: ${roomId})`;

                    // Gửi yêu cầu lấy tin nhắn của phòng
                    const userId = sessionStorage.getItem("user_id");
                    const message = encodeMessage(0x16, roomName, userId);
                    socket.send(message)
                    // socket.send(`load_room_messages ${roomName} ${userId}`);
                });
            });
        }

        socket.onmessage = (event) => {
            const response = event.data;
            let match = response.match(/\d+/);
            let command;
            if (match) {
                // Convert the first integer to a number (base 10)
                command = parseInt(match[0], 10);
                console.log(command.toString(16)); // Output: 14 (hexadecimal of 20)
            } else {
                console.log("No integer found in the response.");
            }

            console.log(response);

            // Check for logout response (RESPONSE_LOGOUT = 0x34 = 52)
            if (command === 0x34) {
                console.log("Logout successful");
                sessionStorage.clear();
                window.location.href = "login.html";
                return;
            }

            if (response.startsWith("error_not_creator")) {
                // Hiển thị thông báo lỗi nếu không phải là người tạo nhóm
                const errorMessage = response.split("error_not_creator ")[1];
                alert(errorMessage);
            } else if (response.includes("You have been removed from the room")) {
                alert(response);
            }
            else if (response === "error_not_a_member") {
                alert("You are not a member of this room. Please rejoin to send messages.");
                getListRoomSideBar();
            }
            else if (response.startsWith("members_list")) {
                const members = response.split("members_list ")[1].split("\n");
                membersList.innerHTML = ""; // Xóa danh sách cũ

                members.forEach(member => {
                    if (member.trim()) {
                        const memberItem = document.createElement("div");
                        memberItem.className = "member-item";
                        memberItem.textContent = member.trim(); // Hiển thị tên và ID
                        membersList.appendChild(memberItem);
                    }
                });
            }
            else if (response.startsWith("user_removed_from_room_success")) {
                alert("User removed successfully from the room!");
                const userId = sessionStorage.getItem("user_id");
                const message = encodeMessage(0x13, userId, "");
                socket.send(message)
                // socket.send(`list_rooms ${userId}`);
            } else if (response === "user_remove_failed") {
                alert("Failed to remove user");
            }
            else if (response.startsWith("left_room_success")) {
                alert("You have successfully left the room.");
                // Reload room list
                const userId = sessionStorage.getItem("user_id");
                const message = encodeMessage(0x13, userId, "");
                socket.send(message)
                // socket.send(`list_rooms ${userId}`);
            } else if (response.startsWith("left_room_failed")) {
                alert("Failed to leave the room.");
            }

            else if (response === "user_added_to_room_success") { //add user vao room
                alert("User added successfully!");
            } else if (response === "user_add_failed") {
                alert("Failed to add user. Please check the User ID or room status.");
            }

            else if (response.startsWith("room_messages")) {
                console.log(response);

                const messages = response.split("room_messages ")[1]; // Lấy nội dung tin nhắn
                chatBody.innerHTML = ""; // Xóa chat cũ
                messages.split("\n").forEach(msg => {
                    if (msg.trim()) {
                        const messageElement = document.createElement("div");
                        if (msg.includes("MESSAGE")) {
                            const parts = msg.split(" ");
                            const sender = parts[1]; // Lấy tên người gửi
                            const content = parts.slice(2).join(" "); // Lấy nội dung tin nhắn

                            // Kiểm tra nếu tin nhắn là của user hiện tại
                            const isCurrentUser = sender === sessionStorage.getItem("user_name");
                            const messageClass = isCurrentUser ? "right" : "left";

                            // Tạo tin nhắn và loại bỏ tên người gửi nếu là tin của user hiện tại
                            const messageElement = document.createElement("div");
                            messageElement.classList.add("message", messageClass);
                            messageElement.innerHTML = isCurrentUser
                                ? `<span class="content">${content}</span>` // Chỉ hiển thị nội dung tin nhắn
                                : `<span class="sender">${sender}:</span> <span class="content">${content}</span>`; // Hiển thị tên và nội dung

                            chatBody.appendChild(messageElement);
                        }
                        chatBody.appendChild(messageElement);
                    }
                });
            }
            else if (response.startsWith("Room created and jofined successfully")) {
                console.log("tao phong thanh cong");
                const userId = sessionStorage.getItem("user_id");
                const username = sessionStorage.getItem("user_name");
                if (userId && username) {
                    console.log(`User: ${username}, ID: ${userId}`);
                    usernameDisplay.textContent = `${username} (ID: ${userId})`; // Hiển thị tên người dùng
                    const message = encodeMessage(0x13, userId, "");
                    socket.send(message)
                    // socket.send(`list_rooms ${userId}`); // Yêu cầu danh sách phòng
                }
            }
            else if (response.startsWith("Joined room successfully")) {
                console.log("join thanh cong");
                const userId = sessionStorage.getItem("user_id");
                const username = sessionStorage.getItem("user_name");
                if (userId && username) {
                    console.log(`User: ${username}, ID: ${userId}`);
                    usernameDisplay.textContent = `${username} (ID: ${userId})`; // Hiển thị tên người dùng
                    const message = encodeMessage(0x13, userId, "");
                    socket.send(message)
                    // socket.send(`list_rooms ${userId}`); // Yêu cầu danh sách phòng
                }
            }
            else if (response.startsWith("new_room_message")) {

                console.log("New message received.");
                getListRoomSideBar()
                const parts = response.split(" ");
                const sender = parts[1]; // Người gửi
                const content = parts.slice(2).join(" "); // Nội dung tin nhắn
                const isCurrentUser = sender === sessionStorage.getItem("user_name");
                const messageClass = isCurrentUser ? "right" : "left";

                // Tạo phần tử tin nhắn
                const messageElement = document.createElement("div");
                messageElement.classList.add("message", messageClass);
                messageElement.innerHTML = isCurrentUser
                    ? `<span class="content">${content}</span>` // Nếu là tin nhắn của user hiện tại
                    : `<span class="sender">${sender}:</span> <span class="content">${content}</span>`; // Nếu là tin nhắn của người khác

                // Thêm tin nhắn vào giao diện
                chatBody.appendChild(messageElement);
                chatBody.scrollTop = chatBody.scrollHeight; // Cuộn xuống cuối
            }
            else if (response === "room_message_success") {
                console.log("Message sent successfully.");
                const userId = sessionStorage.getItem("user_id");
                const roomName = chatHeader.textContent.split(" (")[0];
                if (userId && roomName) {
                    // Gửi yêu cầu tải lại tin nhắn của phòng hiện tại

                    const message = encodeMessage(0x16, roomName, userId);
                    socket.send(message)
                    // socket.send(`load_room_messages ${roomName} ${userId}`);
                }
            }

            else if (response === "room_not_found") {
                alert("Room not found.");
            }

            else if (response.startsWith(0x23)){}

            else {
                // Xử lý hiển thị danh sách phòng
                chatList.innerHTML = "";
                const rooms = response.split("\n").filter(line => line.trim() !== "");

                rooms.forEach(room => {
                    const [roomName, roomId] = room.split(":"); // Tách tên phòng và ID
                    const roomElement = document.createElement("div");
                    roomElement.className = "chat-item";
                    roomElement.innerHTML = `
                <div class="chat-info">
                    <h4>${roomName}:id-${roomId}</h4>
                    <span class="status online"></span>
                </div>
            `;
                    chatList.appendChild(roomElement);
                });

                setupRoomClickEvents(); // Gắn lại event listener
            }
        };
        // setupRoomClickEvents();
        //Tạo room
        createRoomBtn.addEventListener("click", () => {
            const roomName = createRoomInput.value.trim();
            const userId = sessionStorage.getItem("user_id");
            if (roomName && userId) {
                const message = encodeMessage(0x0D, roomName, userId);
                socket.send(message)
                // socket.send(`create_room ${roomName} ${userId}`);

                createRoomInput.value = ""; // Xóa input sau khi gửi
            } else {
                alert("Please enter a room name and make sure you're logged in.");
            }
        });

        // Join Room theo ID
        joinRoomBtn.addEventListener("click", () => {
            const roomId = joinRoomInput.value.trim();
            const userId = sessionStorage.getItem("user_id");
            if (roomId && userId) {

                const message = encodeMessage(0x0E, roomId, userId);
                socket.send(message)
                // socket.send(`join_room ${roomId} ${userId}`);
                joinRoomInput.value = ""; // Xóa input sau khi gửi
            } else {
                alert("Please enter a valid room ID and make sure you're logged in.");
            }
        });
        //ADd user vao room
        addUserBtn.addEventListener("click", () => {
            const userId = addUserInput.value.trim();
            const roomName = chatHeader.textContent.split(" (")[0]; // Lấy tên phòng từ header
            if (userId && roomName) {
                const message = encodeMessage(0x10, roomName, userId);
                socket.send(message)
                // socket.send(`add_to_room ${roomName} ${userId}`);
                getListRoomSideBar();
                addUserInput.value = ""; // Xóa input sau khi gửi
            } else {
                alert("Please enter a valid User ID and make sure you're in a room.");
            }
        });
        //Roi khoi nhom
        leaveRoomBtn.addEventListener("click", () => {
            const userId = sessionStorage.getItem("user_id");
            const roomName = document.getElementById("room-name").textContent.split(" (")[0]; // Lấy tên phòng
            if (userId && roomName) {
                const confirmation = confirm(`Do you want to leave room "${roomName}"?`);
                if (confirmation) {

                    const message = encodeMessage(0x11, roomName, userId);
                    socket.send(message)
                    // socket.send(`leave_room ${roomName} ${userId}`);
                }
            } else {
                alert("Please select a room to leave.");
            }
        });
        // Xoa khoi nhom
        removeUserBtn.addEventListener("click", () => {
            const userIdToRemove = removeUserInput.value.trim();
            const roomName = chatHeader.textContent.split(" (")[0]; // Lấy tên phòng từ header
            const removerId = sessionStorage.getItem("user_id"); // Lấy ID người thực hiện
            console.log(userIdToRemove);
            console.log(roomName);
            console.log(removerId);

            if (userIdToRemove && roomName && removerId) {
                const message = encodeMessage(0x12, roomName, removerId + " " + userIdToRemove);
                socket.send(message)
                // socket.send(`remove_user ${roomName} ${removerId} ${userIdToRemove}`);
                removeUserInput.value = ""; // Xoá input sau khi gửi
            } else {
                alert("Please enter a valid User ID and make sure you're in a room.");
            }
        });
        //danh sach member
        viewMembersBtn.addEventListener("click", () => {
            const roomName = document.getElementById("room-name").textContent.split(" (")[0];
            const userId = sessionStorage.getItem("user_id");
            membersModal.style.display = "block";
            if (roomName && userId) {

                // Gửi yêu cầu lấy danh sách thành viên qua WebSocket
                const message = encodeMessage(0x17, roomName, userId);
                socket.send(message)
                // socket.send(`view_members ${roomName} ${userId}`);
            } else {
                alert("Please select a room first!");
            }
        });

        // Đóng modal
        closeModalBtn.addEventListener("click", () => {
            membersModal.style.display = "none";
        });


        //nhắn tin room
        sendBtn.addEventListener("click", () => {
            const userId = sessionStorage.getItem("user_id");
            const roomName = chatHeader.textContent.split(" (")[0];
            const message = messageInput.value.trim();

            if (message && roomName) {
                const sendMessage = encodeMessage(0x0F, roomName, userId + " " + message);
                socket.send(sendMessage)
                messageInput.value = ""; // Xóa ô nhập tin nhắn
            }
        });

        socket.onerror = (error) => console.error("WebSocket error:", error);
    });


</script>

<body>
    <div class="messenger">
      <!-- Sidebar -->
      <div class="sidebar">
        <div class="sidebar-header">
          <h1>Username</h1>
          <div style="display: flex; gap: 8px; width: 100%; margin-top: 8px;">
            <button id="switch-to-private-chat-view" style="flex: 1; padding: 8px; font-size: 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">
              <i class="fas fa-door-open"></i> Private Chat
            </button>
            <button id="logout-btn" class="logout-btn" title="Logout" style="flex: 1; padding: 8px; font-size: 12px; background: rgba(239, 68, 68, 0.9);">
              <i class="fas fa-sign-out-alt"></i> Logout
            </button>
          </div>
        </div>

        <div style="padding: 12px 16px; border-bottom: 1px solid #e5e7eb;">
          <h3 style="margin: 0 0 10px 0; font-size: 12px; font-weight: 700; color: #6b7280; text-transform: uppercase;">Create Room</h3>
          <div style="display: flex; gap: 8px;">
            <input type="text" id="create-room-input" placeholder="Name" style="flex: 1; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 12px;">
            <button id="create-room-btn" style="padding: 8px 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600;">Create</button>
          </div>
        </div>

        <div style="padding: 12px 16px; border-bottom: 1px solid #e5e7eb;">
          <h3 style="margin: 0 0 10px 0; font-size: 12px; font-weight: 700; color: #6b7280; text-transform: uppercase;">Join Room</h3>
          <div style="display: flex; gap: 8px;">
            <input type="number" id="join-room-input" placeholder="ID" style="flex: 1; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 12px;">
            <button id="join-room-btn" style="padding: 8px 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600;">Join</button>
          </div>
        </div>

        <h3 style="padding: 12px 16px; margin: 0; font-size: 13px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px;">Rooms</h3>
        <div class="chat-list" id="room-list"></div>
      </div>

      <!-- Chat Section -->
      <div class="chat">
        <div class="chat-header">
          <h3 id="room-name" style="margin: 0;">Select a room</h3>
          <div style="display: flex; flex-wrap: wrap; gap: 8px;">
            <div style="display: flex; gap: 8px;">
              <input type="number" id="add-user-input" placeholder="Add User ID" style="padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 12px;">
              <button id="add-user-btn" style="padding: 8px 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600;">Add</button>
            </div>
            <div style="display: flex; gap: 8px;">
              <input type="number" id="remove-user-input" placeholder="Remove User ID" style="padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 12px;">
              <button id="remove-user-btn" style="padding: 8px 12px; background: #f59e0b; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600;">Remove</button>
            </div>
            <button id="view-members-btn" style="padding: 8px 12px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600;">
              <i class="fas fa-users"></i> Members
            </button>
            <button id="leave-room-btn" style="padding: 8px 12px; background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600;">
              <i class="fas fa-sign-out-alt"></i> Leave
            </button>
          </div>
        </div>

        <div class="chat-body" id="chat-body"></div>

        <div class="chat-footer">
          <textarea placeholder="Type a message..." id="message-input"></textarea>
          <button class="send-btn" id="send-btn" title="Send Message">
            <i class="fas fa-paper-plane"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Members Modal -->
    <div id="members-modal" class="modal">
      <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2>Room Members</h2>
        <div id="members-list" class="members-list"></div>
      </div>
    </div>
  </body>
</html>
